workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Check Files and Extract
        script: |
          echo "=== ALL FILES IN REPOSITORY ==="
          ls -la
          
          if [ -f "LeanIOS.zip" ]; then
            echo "Extracting LeanIOS.zip..."
            unzip -q LeanIOS.zip -d .
          else
            echo "LeanIOS.zip not found, checking existing folders..."
          fi
          
          echo "=== FILES AFTER EXTRACTION ==="
          find . -maxdepth 3
          
      - name: Build and Package App
        script: |
          # دۆزینەوەی ڕاستەوخۆی پڕۆژە یان وۆرکسپەیس
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" | head -n 1)
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE_FILE" ]; then
            TARGET_DIR=$(dirname "$WORKSPACE_FILE")
            cd "$TARGET_DIR"
            echo "Building workspace in: $TARGET_DIR"
            xcodebuild -workspace "$(basename "$WORKSPACE_FILE")" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
            mkdir -p ../../build/ios/ipa
            cd build/MedianIOS.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
          elif [ -n "$PROJECT_FILE" ]; then
            TARGET_DIR=$(dirname "$PROJECT_FILE")
            cd "$TARGET_DIR"
            echo "Building project in: $TARGET_DIR"
            xcodebuild -project "$(basename "$PROJECT_FILE")" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
            mkdir -p ../../build/ios/ipa
            cd build/MedianIOS.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
          else
            echo "CRITICAL ERROR: No project files found at all."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.zip
      - "**/build/ios/ipa/*.zip"
      - "**/FlixVision.zip"
