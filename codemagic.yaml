workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Clean Unused Files and Build
        script: |
          echo "=== Extracting ZIP files ==="
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -q "$f" -d .
            fi
          done
          
          # لابردنی مەرجی فایلە ونبووەکانی Tuist لەناو پڕۆژەکەدا ئەگەر هەبن
          echo "=== Starting Direct Build ==="
          mkdir -p build/ios/ipa
          
          if [ -d "FlixVision.xcodeproj" ]; then
            xcodebuild -project FlixVision.xcodeproj -scheme FlixVision -sdk iphoneos -configuration Release archive -archivePath build/FlixVision.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          elif [ -d "FlixVision.xcworkspace" ]; then
            xcodebuild -workspace FlixVision.xcworkspace -scheme FlixVision -sdk iphoneos -configuration Release archive -archivePath build/FlixVision.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
          
          if [ -d "build/FlixVision.xcarchive/Products/Applications/" ]; then
            cd build/FlixVision.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
            echo "SUCCESS: FlixVision.zip created!"
          fi
    artifacts:
      - build/ios/ipa/*.zip
      - "**/build/ios/ipa/*.zip"
