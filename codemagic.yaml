workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Build ipa
        script: |
          xcodebuild -project FlixVision.xcodeproj -scheme FlixVision -sdk iphoneos -configuration Release archive -archivePath build/FlixVision.xcarchive
          xcodebuild -exportArchive -archivePath build/FlixVision.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
