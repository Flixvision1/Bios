workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Extract and Find Project
        script: |
          if [ -f "LeanIOS.zip" ]; then
            unzip -q LeanIOS.zip -d extracted_files
          fi
          # گەڕانی گشتگیر بە دوای فۆڵدەری پڕۆژەدا
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
      - name: Build and Package App
        script: |
          # دۆزینەوەی شوێنی ڕاستەقینەی پڕۆژەکە یان وۆرکسپەیسەکە
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" | head -n 1)
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE_PATH" ]; then
            TARGET_DIR=$(dirname "$WORKSPACE_PATH")
            cd "$TARGET_DIR"
            WORKSPACE_NAME=$(basename "$WORKSPACE_PATH")
            echo "Building workspace: $WORKSPACE_NAME in $TARGET_DIR"
            
            xcodebuild -workspace "$WORKSPACE_NAME" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
            mkdir -p ../../build/ios/ipa
            if [ -d "build/MedianIOS.xcarchive/Products/Applications/" ]; then
              cd build/MedianIOS.xcarchive/Products/Applications/
              zip -r ../../../../build/ios/ipa/FlixVision.zip .
            fi
          elif [ -n "$PROJECT_PATH" ]; then
            TARGET_DIR=$(dirname "$PROJECT_PATH")
            cd "$TARGET_DIR"
            PROJECT_NAME=$(basename "$PROJECT_PATH")
            echo "Building project: $PROJECT_NAME in $TARGET_DIR"
            
            xcodebuild -project "$PROJECT_NAME" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
            mkdir -p ../../build/ios/ipa
            if [ -d "build/MedianIOS.xcarchive/Products/Applications/" ]; then
              cd build/MedianIOS.xcarchive/Products/Applications/
              zip -r ../../../../build/ios/ipa/FlixVision.zip .
            fi
          else
            echo "Error: Neither xcworkspace nor xcodeproj found anywhere!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
      - "**/build/ios/ipa/*.zip"
      - "**/FlixVision.zip"
