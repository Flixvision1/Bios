workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Unzip and Find Project
        script: |
          if [ -f "LeanIOS.zip" ]; then
            unzip -q LeanIOS.zip -d .
          fi
          # گەڕان بە دوای فایلەکانی پڕۆژە لە هەموو شوێنێک
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
      - name: Build Real Archive
        script: |
          # دۆزینەوە و چوونە ناو فۆڵدەری پڕۆژە و باڵدکردن
          PROJECT_DIR=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          fi
          
          echo "Found project at: $PROJECT_DIR"
          
          # ئەگەر پڕۆژە دۆزرایەوە باڵدی بکە
          parent_dir=$(dirname "$PROJECT_DIR")
          cd "$parent_dir"
          
          if [[ "$PROJECT_DIR" == *.xcworkspace ]]; then
            workspace_name=$(basename "$PROJECT_DIR")
            xcodebuild -workspace "$workspace_name" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            project_name=$(basename "$PROJECT_DIR")
            xcodebuild -project "$project_name" -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
          
          mkdir -p ../../build/ios/ipa
          if [ -d "build/MedianIOS.xcarchive/Products/Applications/" ]; then
            cd build/MedianIOS.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
