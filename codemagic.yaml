workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Generate Project and Workspace with Tuist
        script: |
          if [ -f "LeanIOS.zip" ]; then
            unzip -q LeanIOS.zip -d .
          fi
          if [ ! -f "Project.entitlements" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' > Project.entitlements
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Project.entitlements
            echo '<plist version="1.0"><dict></dict></plist>' >> Project.entitlements
          fi
          # دابەزاندن و کارپێکردنی Tuist بۆ دروستکردنی workspace
          curl -Ls https://github.com/tuist/tuist/releases/download/4.213.0/tuist-macos.zip -o tuist.zip
          unzip -q tuist.zip
          chmod +x tuist
          ./tuist generate --no-open
      - name: Build archive and create artifact
        script: |
          xcodebuild -workspace MedianIOS.xcworkspace -scheme Median -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          mkdir -p build/ios/ipa
          cd build/MedianIOS.xcarchive/Products/Applications/
          zip -r ../../../build/ios/ipa/FlixVision.zip .
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
