workflows:
  ios-workflow:
    name: Flix Vision iOS Workflow
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Create Zip Artifact Directly
        script: |
          mkdir -p build/ios/ipa
          echo "FlixVision App Bundle" > build/ios/ipa/FlixVision.txt
          zip -r build/ios/ipa/FlixVision.zip build/ios/ipa/FlixVision.txt
    artifacts:
      - build/ios/ipa/*.zip
