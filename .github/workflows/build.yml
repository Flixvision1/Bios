name: Build iOS App (Free Mac)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Required Folders & Prepare Tests
        run: |
          if [ -f "LeanIOS.zip" ]; then unzip -q LeanIOS.zip; fi
          if [ -f "LeanIOSTests.zip" ]; then unzip -q LeanIOSTests.zip; fi
          mkdir -p LeanIOSTests
          
          if [ ! -f "LeanIOSTests/MedianIOSTests-Info.plist" ]; then
            cat << 'EOF' > LeanIOSTests/MedianIOSTests-Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleDevelopmentRegion</key>
                <string>$(DEVELOPMENT_LANGUAGE)</string>
                <key>CFBundleExecutable</key>
                <string>$(EXECUTABLE_NAME)</string>
                <key>CFBundleIdentifier</key>
                <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundleName</key>
                <string>$(PRODUCT_NAME)</string>
                <key>CFBundlePackageType</key>
                <string>BNDL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
            </dict>
            </plist>
            EOF
          fi

          if [ -f "FlixVision.xcodeproj.zip" ]; then unzip -q FlixVision.xcodeproj.zip; fi
          if [ -f "FlixVision.xcworkspace.zip" ]; then unzip -q FlixVision.xcworkspace.zip; fi

      - name: Install Tuist via Homebrew
        run: |
          brew install tuist
          tuist generate

      - name: Build Archive
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -workspace MedianIOS.xcworkspace -scheme MedianIOS -sdk iphoneos -configuration Release archive -archivePath build/MedianIOS.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Zip IPA
        run: |
          if [ -d "build/MedianIOS.xcarchive/Products/Applications/" ]; then
            cd build/MedianIOS.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixVision-App
          path: build/ios/ipa/*.zip
