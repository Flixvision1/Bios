name: Build iOS App (Free Mac)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Required Zips & Derived Data
        run: |
          if [ -f "LeanIOS.zip" ]; then unzip -q LeanIOS.zip; fi
          if [ -f "LeanIOSTests.zip" ]; then unzip -q LeanIOSTests.zip; fi
          mkdir -p LeanIOSTests
          
          if [ ! -f "LeanIOSTests/MedianIOSTests-Info.plist" ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleDevelopmentRegion</key>\n    <string>$(DEVELOPMENT_LANGUAGE)</string>\n    <key>CFBundleExecutable</key>\n    <string>$(EXECUTABLE_NAME)</string>\n    <key>CFBundleIdentifier</key>\n    <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>\n    <key>CFBundleInfoDictionaryVersion</key>\n    <string>6.0</string>\n    <key>CFBundleName</key>\n    <string>$(PRODUCT_NAME)</string>\n    <key>CFBundlePackageType</key>\n    <string>BNDL</string>\n    <key>CFBundleShortVersionString</key>\n    <string>1.0</string>\n    <key>CFBundleVersion</key>\n    <string>1</string>\n</dict>\n</plist>\n' > LeanIOSTests/MedianIOSTests-Info.plist
          fi

          if [ -f "FlixVision.xcodeproj.zip" ]; then unzip -q FlixVision.xcodeproj.zip; fi
          if [ -f "FlixVision.xcworkspace.zip" ]; then unzip -q FlixVision.xcworkspace.zip; fi
          if [ -f "Derived.zip" ]; then unzip -q Derived.zip; fi

      - name: Build Archive Directly
        run: |
          xcodebuild -workspace FlixVision.xcworkspace -scheme FlixVision -sdk iphoneos -configuration Release archive -archivePath build/FlixVision.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation

      - name: Create Proper IPA
        run: |
          mkdir -p build/Payload
          cp -r build/FlixVision.xcarchive/Products/Applications/FlixVision.app build/Payload/
          cd build
          zip -r FlixVision.ipa Payload
          mkdir -p ios/ipa
          mv FlixVision.ipa ios/ipa/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixVision-IPA
          path: build/ios/ipa/*.ipa
