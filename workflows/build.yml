name: Build iOS App (Free Mac)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tuist
        run: |
          curl -sL https://get.tuist.io | bash
          tuist generate

      - name: Build Archive
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -project FlixVision.xcodeproj -scheme FlixVision -sdk iphoneos -configuration Release archive -archivePath build/FlixVision.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Zip IPA
        run: |
          if [ -d "build/FlixVision.xcarchive/Products/Applications/" ]; then
            cd build/FlixVision.xcarchive/Products/Applications/
            zip -r ../../../../build/ios/ipa/FlixVision.zip .
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixVision-App
          path: build/ios/ipa/*.zip
